<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>讲座雷达 · 公众号讲座信息汇总</title>
<style>
  :root{
    --bg:#f6f6f3;
    --card:#ffffff;
    --ink:#1b2330;
    --ink-2:#4a5568;
    --ink-3:#8b95a5;
    --line:#e4e4de;
    --accent:#1f5c53;
    --accent-soft:#e7f1ef;
    --warn:#b45309;
    --warn-soft:#fdf1e3;
    --credit:#4338ca;
    --credit-soft:#eef0ff;
    --radius:14px;
    --side:236px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .app{display:flex;min-height:100vh}

  /* ---------- sidebar ---------- */
  .side{
    width:var(--side);flex:0 0 var(--side);
    border-right:1px solid var(--line);
    background:#fbfbf9;
    padding:22px 16px 18px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:baseline;gap:7px;padding:0 6px 16px}
  .brand b{font-size:18px;letter-spacing:-.3px}
  .brand span{font-size:11px;color:var(--ink-3)}
  .navgroup{margin-bottom:18px}
  .navgroup h3{
    font-size:10.5px;font-weight:600;color:var(--ink-3);
    letter-spacing:1.2px;text-transform:uppercase;
    margin:0 0 6px;padding:0 8px;
  }
  .navitem{
    display:flex;align-items:center;gap:8px;
    padding:6px 9px;border-radius:8px;cursor:pointer;
    font-size:13px;color:var(--ink-2);
    border:none;background:none;width:100%;text-align:left;font-family:inherit;
    transition:background .14s,color .14s;
  }
  .navitem:hover{background:#f0f0eb;color:var(--ink)}
  .navitem.on{background:var(--accent);color:#fff}
  .navitem.on .cnt{color:rgba(255,255,255,.78)}
  .navitem .dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px;background:currentColor;opacity:.4}
  .navitem.on .dot{opacity:1;background:#fff}
  .navitem .cnt{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .sidefoot{
    margin-top:22px;padding:12px 8px 0;border-top:1px solid var(--line);
    font-size:11px;color:var(--ink-3);line-height:1.75;
  }

  /* ---------- main ---------- */
  main{flex:1;min-width:0;padding:0 28px 60px}
  .topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(246,246,243,.94);backdrop-filter:blur(8px);
    padding:18px 0 12px;border-bottom:1px solid var(--line);
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .search{flex:1 1 240px;min-width:170px;position:relative}
  .search input{
    width:100%;padding:9px 12px 9px 34px;
    border:1px solid var(--line);border-radius:10px;background:#fff;
    font-size:13px;color:var(--ink);outline:none;font-family:inherit;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.4}
  .seg{display:flex;flex:0 0 auto;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
  .seg button{
    border:none;background:none;padding:7px 12px;font-size:12.5px;color:var(--ink-2);
    cursor:pointer;font-family:inherit;transition:all .14s;
  }
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent);color:#fff}
  .btn{
    border:1px solid var(--line);background:#fff;border-radius:9px;
    padding:8px 13px;font-size:12.5px;color:var(--ink-2);cursor:pointer;
    font-family:inherit;white-space:nowrap;transition:all .14s;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}

  /* ---------- stats ---------- */
  .stats{display:flex;gap:30px;padding:18px 2px 2px;flex-wrap:wrap}
  .stat .n{font-size:22px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.2}
  .stat .n.hot{color:var(--warn)}
  .stat .n.cr{color:var(--credit)}
  .stat .k{font-size:11.5px;color:var(--ink-3)}

  /* ---------- section head ---------- */
  .sechead{
    display:flex;align-items:baseline;gap:10px;
    margin:20px 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line);
  }
  .sechead h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.2px}
  .sechead .num{font-size:12px;color:var(--ink-3)}

  /* ---------- grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;display:flex;gap:15px;
    transition:box-shadow .18s,transform .18s,border-color .18s;position:relative;
  }
  .card:hover{box-shadow:0 6px 22px rgba(27,35,48,.07);transform:translateY(-1px);border-color:#d8d8d0}
  .card.past{opacity:.6}
  .card.past:hover{opacity:.85}
  .datebox{
    flex:0 0 50px;text-align:center;padding-top:2px;
    border-right:1px solid var(--line);padding-right:13px;
  }
  .datebox .m{font-size:10.5px;color:var(--ink-3);letter-spacing:.8px}
  .datebox .d{font-size:21px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
  .datebox .w{font-size:10.5px;color:var(--ink-3)}
  .datebox.past .d{color:var(--ink-3)}
  .body{flex:1;min-width:0}
  .titlerow{display:flex;gap:7px;align-items:flex-start;margin-bottom:6px}
  .title{
    font-size:15px;font-weight:600;line-height:1.45;letter-spacing:-.1px;
    text-decoration:none;flex:1;min-width:0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  a.title:hover{color:var(--accent)}
  .badge{
    flex:0 0 auto;font-size:10.5px;padding:2px 7px;border-radius:6px;font-weight:600;
    background:var(--accent-soft);color:var(--accent);white-space:nowrap;
  }
  .badge.today{background:var(--warn-soft);color:var(--warn)}
  .badge.past{background:#f0f0ec;color:var(--ink-3)}
  .badge.new{background:#fff4e5;color:#c2410c}
  .badge.credit{background:var(--credit-soft);color:var(--credit)}
  .badge.campus{background:#eef5f3;color:#1f5c53}
  .badge.muted{background:#f0f0ec;color:var(--ink-3);font-weight:500}
  .badge.aud{background:#f2f2fd;color:#4338ca;font-weight:500}
  .badge.col0{background:#eef5f3;color:#1f5c53;font-weight:600}
  .badge.col1{background:#eef4fc;color:#1d4ed8;font-weight:600}
  .meta{display:flex;flex-direction:column;gap:2px;margin-bottom:7px}
  .meta div{font-size:12.5px;color:var(--ink-2);display:flex;gap:7px;align-items:baseline}
  .meta .k{color:var(--ink-3);flex:0 0 auto;min-width:32px}
  .meta .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .summary{
    font-size:12.5px;color:var(--ink-3);line-height:1.65;margin:0 0 8px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .cat{
    font-size:10.5px;padding:1px 7px;border-radius:5px;
    border:1px solid var(--line);color:var(--ink-2);background:#fafaf7;
  }
  .cat.c0{border-color:#cfe3df;background:#eef5f3;color:#1f5c53}
  .cat.c1{border-color:#dcdcf8;background:#f2f2fd;color:#4338ca}
  .cat.c2{border-color:#cfe0f4;background:#eef4fc;color:#1d4ed8}
  .cat.c3{border-color:#f4e0c7;background:#fdf4e8;color:#b45309}
  .cat.c4{border-color:#f3d3d8;background:#fdf0f2;color:#be123c}
  .tag{font-size:10.5px;padding:1px 7px;border-radius:5px;background:#f3f4f1;color:var(--ink-2);border:1px solid #eaeae4}
  .src{font-size:11px;color:var(--ink-3);margin-left:auto;display:flex;gap:5px;align-items:center}
  .src a{color:var(--accent);text-decoration:none;border-bottom:1px dotted rgba(31,92,83,.4)}
  .src a:hover{border-bottom-style:solid}

  /* ---------- timeline ---------- */
  .daygroup{margin-bottom:22px}
  .dayhead{
    display:flex;align-items:center;gap:10px;margin-bottom:9px;
    position:sticky;top:66px;background:rgba(246,246,243,.95);
    padding:5px 0;backdrop-filter:blur(6px);z-index:5;
  }
  .dayhead .dd{font-size:14px;font-weight:700;letter-spacing:-.2px}
  .dayhead .dw{font-size:11.5px;color:var(--ink-3)}
  .dayhead .rel{
    font-size:10.5px;padding:1px 7px;border-radius:5px;
    background:var(--warn-soft);color:var(--warn);font-weight:600;
  }
  .dayhead .ln{flex:1;height:1px;background:var(--line)}
  .tl{display:flex;flex-direction:column;gap:10px}

  /* ---------- table ---------- */
  .tblwrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;background:var(--card);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:12.5px}
  th{
    text-align:left;font-weight:600;font-size:11px;color:var(--ink-3);
    letter-spacing:.4px;padding:10px 12px;background:#fafaf7;border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  td{padding:10px 12px;border-bottom:1px solid #f0f0ea;vertical-align:top}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fcfcfa}
  td.t{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  td.n a{text-decoration:none;font-weight:500}
  td.n a:hover{color:var(--accent);text-decoration:underline}
  td.dim{color:var(--ink-3)}

  /* ---------- empty / footer ---------- */
  .empty{
    text-align:center;padding:70px 20px;color:var(--ink-3);
    border:1px dashed var(--line);border-radius:var(--radius);background:#fff;
  }
  .empty .big{font-size:15px;color:var(--ink-2);margin-bottom:5px}
  footer{
    margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(18px);
    background:var(--ink);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;
    opacity:0;pointer-events:none;transition:all .24s;z-index:99;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- responsive ---------- */
  @media(max-width:900px){
    .app{flex-direction:column}
    .side{
      width:100%;flex:none;height:auto;position:static;
      border-right:none;border-bottom:1px solid var(--line);
      padding:14px 16px 6px;
    }
    .brand{padding-bottom:10px}
    .navgroup{margin-bottom:8px;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
    .navgroup::-webkit-scrollbar{display:none}
    .navgroup h3{display:none}
    .navitem{width:auto;flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:#fff}
    .navitem .cnt{margin-left:4px}
    .sidefoot{display:none}
    main{padding:0 14px 50px}
    .topbar{padding:12px 0}
    .search{flex:1 1 100%}
    .grid{grid-template-columns:minmax(0,1fr)}
    .dayhead{top:0}
  }
</style>
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="brand"><b>讲座雷达</b><span>广工 · 校内优先</span></div>
    <nav id="nav"></nav>
    <div class="sidefoot" id="sidefoot"></div>
  </aside>

  <main>
    <div class="topbar">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1b2330" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>
        <input id="q" type="search" placeholder="搜标题、主讲人、地点、主办…">
      </div>
      <div class="seg" id="views">
        <button data-view="grid" class="on">卡片</button>
        <button data-view="timeline">时间轴</button>
        <button data-view="table">表格</button>
      </div>
      <button class="btn" id="copyBtn">复制简报</button>
    </div>

    <div class="stats" id="stats"></div>
    <div id="content"></div>

    <footer>
      <span id="footL"></span>
      <span id="footR"></span>
    </footer>
  </main>
</div>
<div class="toast" id="toast"></div>

const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
const state = { nav:"all", q:"", view:"grid" };

function parseDate(s){
  if(!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if(!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3]);
}
function fmtDate(s){
  const d = parseDate(s);
  if(!d) return {m:"待定", d:"--", w:""};
  return { m:(d.getMonth()+1)+"月", d:String(d.getDate()).padStart(2,"0"), w:WEEK[d.getDay()] };
}
function daysFromToday(s){
  const d = parseDate(s);
  if(!d) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t)/86400000);
}
function esc(s){
  return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
const CAT_CLASS = {"学术报告":"c0","论坛会议":"c1","学术会议":"c2","宣讲招聘":"c3","学科竞赛":"c4","其他":""};

/* ---------- nav ---------- */
function navDefs(){
  const cats = {};
  DATA.forEach(r=>{ const c = r.category || "其他"; cats[c] = (cats[c]||0)+1; });
  const order = ["学术报告","学术会议","论坛会议","宣讲招聘","学科竞赛","其他"];
  const catItems = order.filter(c=>cats[c]).map(c=>({key:"cat:"+c, label:c}));
  Object.keys(cats).forEach(c=>{ if(!order.includes(c)) catItems.push({key:"cat:"+c, label:c}); });

  // 范围：校内 / 校外 / 地点待确认
  const scopeItems = [];
  if(DATA.some(r=>r.on_campus===true)) scopeItems.push({key:"scope:on", label:"校内讲座"});
  if(DATA.some(r=>r.on_campus===false)) scopeItems.push({key:"scope:off", label:"校外 / 外埠"});
  if(DATA.some(r=>r.on_campus==null)) scopeItems.push({key:"scope:unknown", label:"地点待确认"});

  // 面向学院：自动化 / 信工 两个独立入口（即使暂无数据也保留，便于持续投喂）
  const cgroups = (META.college_groups && META.college_groups.length)
    ? META.college_groups : ["自动化学院","信息工程学院"];
  const colItems = cgroups.map(c=>({key:"college:"+c, label:"面向"+c}));
  if(DATA.some(r=>!r.college)) colItems.push({key:"college:__other", label:"其他院系 / 全校"});

  // 受众：只列出数据里真实出现过的标签
  const auds = {};
  DATA.forEach(r=>String(r.audience||"").split("、").filter(Boolean).forEach(a=>{auds[a]=(auds[a]||0)+1;}));
  const audOrder = ["全校学生","研究生","本科生","教师"];
  const audItems = audOrder.filter(a=>auds[a]).map(a=>({key:"aud:"+a, label:a}));
  Object.keys(auds).forEach(a=>{ if(!audOrder.includes(a)) audItems.push({key:"aud:"+a, label:a}); });

  const groups = [
    { title:"时间", items:[
      {key:"all", label:"全部讲座"},
      {key:"today", label:"今天"},
      {key:"tomorrow", label:"明天"},
      {key:"week", label:"未来 7 天"},
      {key:"past", label:"已结束"}
    ]},
    { title:"学分条", items:[
      {key:"credit", label:"有学术条 / 实践条"}
    ]}
  ];
  if(colItems.length) groups.push({ title:"面向学院", items: colItems });
  if(scopeItems.length) groups.push({ title:"参与范围", items: scopeItems });
  if(audItems.length) groups.push({ title:"受众身份", items: audItems });
  groups.push({ title:"类型", items: catItems });
  groups.push({ title:"来源", items:[
    {key:"src:wechat", label:"公众号"},
    {key:"src:web", label:"学校官网"}
  ]});
  return groups;
}

/* ---------- 过滤 ---------- */
function baseMatch(r){
  if(state.q){
    const hay = [r.title,r.speaker,r.location,r.org,r.source,r.category,(r.tags||[]).join(" "),r.summary].join(" ").toLowerCase();
    if(!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}
function navMatch(r){
  const k = state.nav, n = daysFromToday(r.date);
  if(k === "all") return true;
  if(k === "today") return n === 0;
  if(k === "tomorrow") return n === 1;
  if(k === "week") return n !== null && n >= 0 && n <= 7;
  if(k === "past") return n !== null && n < 0;
  if(k === "credit") return !!r.credit;
  if(k === "scope:on") return r.on_campus === true;
  if(k === "scope:off") return r.on_campus === false;
  if(k === "scope:unknown") return r.on_campus == null;
  if(k.startsWith("aud:")) return String(r.audience||"").includes(k.slice(4));
  if(k === "college:__other") return !r.college;
  if(k.startsWith("college:")) return r.college === k.slice(8);
  if(k.startsWith("cat:")) return (r.category || "其他") === k.slice(4);
  if(k === "src:wechat") return r.src_type === "wechat";
  if(k === "src:web") return r.src_type === "web";
  return true;
}
function countFor(key){
  const save = state.nav; state.nav = key;
  const n = DATA.filter(r=>baseMatch(r) && navMatch(r)).length;
  state.nav = save; return n;
}
function rows(){
  return DATA.filter(r=>baseMatch(r) && navMatch(r)).sort((a,b)=>{
    const oa = a.status === "past" ? 1 : 0, ob = b.status === "past" ? 1 : 0;
    if(oa !== ob) return oa - ob;
    const da = parseDate(a.date), db = parseDate(b.date);
    if(!da && !db) return 0;
    if(!da) return 1;
    if(!db) return -1;
    return oa ? db - da : da - db;
  });
}

/* ---------- 组件 ---------- */
function cardHTML(r){
  const f = fmtDate(r.date);
  const isPast = r.status === "past";
  const badges = [];
  if(r.credit) badges.push(`<span class="badge credit">${esc(r.credit)}</span>`);
  if(r.is_new && !isPast) badges.push('<span class="badge new">新</span>');
  if(!isPast && r.status !== "unknown") badges.push(`<span class="badge ${r.status==='today'?'today':''}">${esc(r.status_text)}</span>`);
  if(isPast) badges.push('<span class="badge past">已结束</span>');

  const meta = [];
  if(r.speaker) meta.push(`<div><span class="k">主讲</span><span class="v">${esc(r.speaker)}</span></div>`);
  if(r.time_text) meta.push(`<div><span class="k">时间</span><span class="v">${esc(r.time_text)}</span></div>`);
  if(r.location) meta.push(`<div><span class="k">地点</span><span class="v">${esc(r.location)}</span></div>`);
  if(r.org) meta.push(`<div><span class="k">主办</span><span class="v">${esc(r.org)}</span></div>`);

  const cat = r.category || "其他";
  const catHTML = `<span class="cat ${CAT_CLASS[cat]||""}">${esc(cat)}</span>`;
  const chips = [];
  if(r.college) chips.push(`<span class="badge ${r.college==="自动化学院"?"col0":"col1"}">${esc(r.college)}</span>`);
  if(r.on_campus === true) chips.push(`<span class="badge campus">${esc(r.campus && r.campus!=="校内" ? r.campus : "校内")}</span>`);
  if(r.on_campus === false) chips.push('<span class="badge muted">校外</span>');
  if(r.audience) chips.push(`<span class="badge aud">${esc(r.audience)}</span>`);
  const tags = (r.tags||[]).slice(0,2).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  const titleHTML = r.url
    ? `<a class="title" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`
    : `<span class="title">${esc(r.title)}</span>`;
  const srcLink = r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">原文 ↗</a>` : "";

  return `<article class="card ${isPast?'past':''}">
    <div class="datebox ${isPast?'past':''}">
      <div class="m">${f.m}</div><div class="d">${f.d}</div><div class="w">${f.w}</div>
    </div>
    <div class="body">
      <div class="titlerow">${titleHTML}${badges.join("")}</div>
      ${meta.length?`<div class="meta">${meta.join("")}</div>`:""}
      ${r.summary?`<p class="summary">${esc(r.summary)}</p>`:""}
      <div class="foot">${catHTML}${chips.join("")}${tags}<span class="src">${esc(r.source||"")} ${srcLink}</span></div>
    </div>
  </article>`;
}

function tableHTML(list){
  const body = list.map(r=>{
    const n = daysFromToday(r.date);
    const dim = (n !== null && n < 0) ? ' style="color:var(--ink-3)"' : '';
    const tt = (r.time_text||"").replace(/^\d{4}年\d{1,2}月\d{1,2}日\s*/,"");
    return `<tr>
      <td class="t">${esc((r.date||"待定").slice(5))}<br><span style="color:var(--ink-3)">${esc(tt)}</span></td>
      <td class="n"><a href="${esc(r.url||"#")}" target="_blank" rel="noopener"${dim}>${esc(r.title)}</a></td>
      <td><span class="cat ${CAT_CLASS[r.category||"其他"]||""}">${esc(r.category||"其他")}</span></td>
      <td>${r.credit?`<span class="badge credit">${esc(r.credit)}</span>`:'<span style="color:var(--ink-3)">—</span>'}</td>
      <td class="dim">${esc(r.location||"—")}</td>
      <td class="dim">${esc(r.speaker||"—")}</td>
    </tr>`;
  }).join("");
  return `<div class="tblwrap"><table>
    <thead><tr><th>日期</th><th>讲座</th><th>类型</th><th>学分条</th><th>地点</th><th>主讲</th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

/* ---------- 渲染 ---------- */
function renderNav(){
  document.getElementById("nav").innerHTML = navDefs().map(g=>{
    const items = g.items.map(it=>`
      <button class="navitem ${state.nav===it.key?'on':''}" data-nav="${esc(it.key)}">
        <span class="dot"></span><span>${esc(it.label)}</span><span class="cnt">${countFor(it.key)}</span>
      </button>`).join("");
    return `<div class="navgroup"><h3>${esc(g.title)}</h3>${items}</div>`;
  }).join("");
}

function navLabel(){
  const k = state.nav;
  if(k.startsWith("cat:")) return "类型 · " + k.slice(4);
  if(k.startsWith("aud:")) return "受众 · " + k.slice(4);
  if(k === "college:__other") return "面向学院 · 其他院系 / 全校";
  if(k.startsWith("college:")) return "面向 · " + k.slice(8);
  if(k === "src:wechat") return "来源 · 公众号";
  if(k === "src:web") return "来源 · 学校官网";
  if(k === "credit") return "带学术条 / 实践条";
  if(k === "scope:on") return "参与范围 · 校内讲座";
  if(k === "scope:off") return "参与范围 · 校外 / 外埠";
  if(k === "scope:unknown") return "参与范围 · 地点待确认";
  return {all:"全部讲座", today:"今天", tomorrow:"明天", week:"未来 7 天", past:"已结束"}[k] || "全部讲座";
}

function render(){
  const list = rows();

  let inner = "";
  if(state.view === "grid"){
    inner = `<div class="grid">${list.map(cardHTML).join("")}</div>`;
  } else if(state.view === "table"){
    inner = tableHTML(list);
  } else {
    const groups = [];
    list.forEach(r=>{
      const key = r.date || "待定";
      let g = groups.find(x=>x.key===key);
      if(!g){ g = {key, items:[]}; groups.push(g); }
      g.items.push(r);
    });
    inner = groups.map(g=>{
      const f = fmtDate(g.key);
      const n = daysFromToday(g.key);
      const rel = n===0?"今天":(n===1?"明天":(n===2?"后天":""));
      return `<div class="daygroup">
        <div class="dayhead">
          <span class="dd">${f.m}${f.d}</span>
          <span class="dw">${f.w}</span>
          ${rel?`<span class="rel">${rel}</span>`:""}
          <span class="ln"></span>
          <span class="dw">${g.items.length} 场</span>
        </div>
        <div class="tl">${g.items.map(cardHTML).join("")}</div>
      </div>`;
    }).join("");
  }

  c.innerHTML = `<div class="sechead"><h2>${esc(navLabel())}</h2><span class="num">${list.length} 条</span></div>${inner}`;
}

function renderStats(){
  const today = DATA.filter(r=>daysFromToday(r.date)===0).length;
  const week = DATA.filter(r=>{const n=daysFromToday(r.date);return n!==null&&n>=0&&n<=7;}).length;
  const credit = DATA.filter(r=>!!r.credit).length;
  const fresh = DATA.filter(r=>r.is_new).length;
  const oncampus = DATA.filter(r=>r.on_campus===true).length;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="n">${oncampus}</div><div class="k">校内讲座</div></div>
    <div class="stat"><div class="n ${today?'hot':''}">${today}</div><div class="k">今天开讲</div></div>
    <div class="stat"><div class="n">${week}</div><div class="k">未来 7 天</div></div>
    <div class="stat"><div class="n ${credit?'cr':''}">${credit}</div><div class="k">带学分条</div></div>
    <div class="stat"><div class="n ${fresh?'hot':''}">${fresh}</div><div class="k">24h 新增</div></div>`;
}

/* ---------- 简报 ---------- */
function briefText(){
  const rs = DATA.filter(r=>{const n=daysFromToday(r.date);return n===0||n===1;})
    .sort((a,b)=>(parseDate(a.date)||0)-(parseDate(b.date)||0));
  if(!rs.length) return "近两日没有已收录的讲座。";
  const head = "【讲座提醒】" + new Date().toLocaleDateString("zh-CN") + "\n";
  return head + rs.map(r=>{
    const p = [`${r.date||"待定"} ${(r.time_text||"").replace(/^\d{4}年\d{1,2}月\d{1,2}日\s*/,"")}`.trim()];
    if(r.speaker) p.push(r.speaker);
    if(r.location) p.push(r.location);
    if(r.credit) p.push("【"+r.credit+"】");
    return `· ${r.title}\n  ${p.join(" | ")}`;
  }).join("\n");
}

/* ---------- 事件绑定 ---------- */
document.getElementById("q").addEventListener("input", e=>{
  state.q = e.target.value.trim(); renderNav(); render();
});
document.getElementById("nav").addEventListener("click", e=>{
  const b = e.target.closest(".navitem"); if(!b) return;
  state.nav = b.dataset.nav; renderNav(); render();
  window.scrollTo({top:0, behavior:"smooth"});
});
document.getElementById("views").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  [...document.querySelectorAll("#views button")].forEach(x=>x.classList.toggle("on", x===b));
  state.view = b.dataset.view; render();
});
document.getElementById("copyBtn").addEventListener("click", async ()=>{
  const text = briefText();
  try{ await navigator.clipboard.writeText(text); toast("简报已复制"); }
  catch(_){ window.prompt("手动复制：", text); }
});
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  setTimeout(()=>el.classList.remove("on"), 1600);
}

/* ---------- 启动 ---------- */
document.getElementById("footL").textContent =
  "数据更新 " + (META.updated_at ? META.updated_at.replace("T"," ").slice(0,16) : "尚未采集");
document.getElementById("footR").textContent = (META.watch_count
  ? "范围：" + (META.scope || "自定") + " · 关注 " + META.watch_count + " 个来源"
  : "尚未设置关注清单")
  + (META.focus_audience && META.focus_audience.length ? " · 重点受众：" + META.focus_audience.join(" / ") : "");
document.getElementById("sidefoot").innerHTML =
  "更新于<br>" + (META.updated_at ? META.updated_at.replace("T"," ").slice(0,16) : "—") +
  "<br><br>来源 " + (META.watch_count||0) + " 个 · 共 " + DATA.length + " 条" +
  (META.focus_audience && META.focus_audience.length
    ? "<br>重点受众<br>" + META.focus_audience.map(a=>"· "+esc(a)).join("<br>")
    : "");

renderStats();
renderNav();
render();
</script>
